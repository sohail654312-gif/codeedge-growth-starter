name: Growth Starter independent cutover catalog review
on:
  push:
    branches:
      - 'review/growth-starter-completion-baseline-*'
      - 'review/growth-starter-auth-cutover-hardening-*'
    paths:
      - 'scripts/phase315r-cutover-evidence.mjs'
      - 'db/reviews/phase315r_effective_privileges_READ_ONLY.sql'
      - 'tests/phase315o-auth.test.mjs'
      - 'backend/pg-session-authority.mjs'
      - 'backend/pg-session-authority.test.mjs'
      - 'backend/phase315m-private-runtime.mjs'
      - 'tests/phase315m-private-transport.test.mjs'
      - 'tests/phase315r-cutover-evidence.test.mjs'
      - '.github/workflows/cutover-catalog-review.yml'
      - 'GROWTH-STARTER-COMPLETION-BASELINE.md'
      - 'AUTH-AUTHORITY-ACCEPTANCE.md'
      - 'DATABASE-CUTOVER-READINESS.md'
      - 'CLIENT-WORKSPACE-ACCEPTANCE.md'
      - 'GROWTH-STARTER-NEXT-RELEASE-REPORT.md'
  pull_request:
    branches:
      - engineering/phase2-core-security
      - 'review/growth-starter-completion-baseline-*'
      - 'review/growth-starter-auth-cutover-hardening-*'
    paths:
      - 'scripts/phase315r-cutover-evidence.mjs'
      - 'tests/phase315r-cutover-evidence.test.mjs'
      - 'backend/pg-session-authority.mjs'
      - 'backend/pg-session-authority.test.mjs'
      - 'backend/phase315m-private-runtime.mjs'
      - 'tests/phase315m-private-transport.test.mjs'
      - '.github/workflows/cutover-catalog-review.yml'
      - 'GROWTH-STARTER-COMPLETION-BASELINE.md'
      - 'AUTH-AUTHORITY-ACCEPTANCE.md'
      - 'DATABASE-CUTOVER-READINESS.md'
      - 'CLIENT-WORKSPACE-ACCEPTANCE.md'
      - 'GROWTH-STARTER-NEXT-RELEASE-REPORT.md'
permissions:
  contents: read
jobs:
  verify-catalog-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify evidence-only script syntax
        run: node --check scripts/phase315r-cutover-evidence.mjs
      - name: Run fail-closed issuer, gateway and privilege regressions
        run: node --test tests/phase315r-cutover-evidence.test.mjs
      - name: Run entire source regression suite without network or secrets
        run: node --test tests/*.test.mjs backend/pg-session-authority.test.mjs
