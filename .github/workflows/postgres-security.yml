name: Growth Starter disposable PostgreSQL security
on:
  push:
    branches: [engineering/phase2-core-security, release/growth-starter-candidate-20261030, review/growth-starter-session-bridge-policy-20261030]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gs_test
          POSTGRES_PASSWORD: ephemeral_qa_only
          POSTGRES_DB: gs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gs_test -d gs_test"
          --health-interval 5s --health-timeout 5s --health-retries 8
    env:
      TEST_DATABASE_URL: postgres://gs_test:ephemeral_qa_only@localhost:5432/gs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Syntax check PostgreSQL and identity modules
        run: |
          node --check backend/postgres-store.mjs
          node --check backend/verified-identity.mjs
          node --check backend/media-gate.mjs
          node --check backend/image-inspector.mjs
      - name: Restricted Auth bridge with synthetic Auth tables
        env:
          GS315S_DISPOSABLE_ONLY: '1'
        run: node --test --test-concurrency=1 tests/postgres/phase315s-auth-bridge.pg.test.mjs
      - name: Real database transactions and signed synthetic HTTP sessions
        run: find tests/postgres -maxdepth 1 -name '*.test.mjs' ! -name 'phase315s-auth-bridge.pg.test.mjs' -print0 | xargs -0 node --test --test-concurrency=1
      - name: Save reproducible PostgreSQL query measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-pg17-performance
          path: |
            work/phase315o-pg-performance.json
            work/phase315p-pg-evidence.json
          if-no-files-found: error
