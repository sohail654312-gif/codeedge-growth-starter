name: Prepare candidate dependency lock on GitHub
on:
  push:
    branches: [release/growth-starter-candidate-20261030]
    paths: [.github/workflows/prepare-candidate-lock.yml]
permissions:
  contents: read
jobs:
  prepare-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the exact patched Vite version without running install scripts
        run: npm install --save-dev --save-exact --package-lock-only --ignore-scripts --no-fund vite@6.4.5
      - name: Return the generated manifests for review before committing
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          console.log('GROWTH_LOCK_PAYLOAD_BEGIN');
          console.log(JSON.stringify({packageJson:readFileSync('package.json','utf8'),packageLock:readFileSync('package-lock.json','utf8')}));
          console.log('GROWTH_LOCK_PAYLOAD_END');
          NODE
