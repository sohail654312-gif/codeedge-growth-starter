name: Growth Starter core safety checks
on:
  push:
    branches: [main, engineering/phase2-core-security]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent domain, route, and regression tests (stubbed SDK)
        run: node --test tests/*.test.mjs
      - name: Check for conflict markers and accidental secret examples
        shell: bash
        run: |
          if grep -R -n -E '^(<<<<<<< |=======|>>>>>>> )' backend src tests; then exit 1; fi
